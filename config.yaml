# Все пути и гиперпараметры проекта. Локальные переопределения - в config.local.yaml (не в git).

data:
  dir: data/hackathonlicence          # куда распакован hackathonlicence.zip
  consumption: consumption.parquet
  connection: connection.parquet
  market_access: market_access.parquet
  mo_names: ref/mo_names.csv          # справочник territory_id -> название (СберИндекс, CC BY-SA 4.0)
  events: ref/events_merged.csv       # каталог событий: ref/events.csv (наш) + реестр maloyan с привязкой к МО (python -m sbi.news)
  national: ref/consumer_spending_national.csv  # СберИндекс «Потребительские расходы», РФ, млрд руб./мес.

output_dir: out                       # прогнозы, метрики, рисунки (не в git)
seed: 42

validation:
  first_origin: "2023-12"             # последняя известная дата в первой точке прогноза
  last_origin: "2024-11"
  horizons: [1, 3, 6, 12]
  max_h: 12
  baseline: prophet                   # с чем сравниваем в тесте Диболда-Мариано

models:
  naive: {}
  seasonal_naive: {}
  prophet:
    n_jobs: 12
    yearly_seasonality: auto          # по умолчанию: годовая сезонность выключается при < 2 лет данных
    weekly_seasonality: false
    daily_seasonality: false
  panel_ssm:
    national_rule: combo              # snaive | hybrid | airline | extlvl | combo | chronos
    ext_map: fixed                    # категория -> нац. ряд по смыслу (sbi.national.EXT_MAP)
  panel_ssm_automap:
    national_rule: combo
    ext_map: auto                     # абляция: нац. ряд выбирается по данным до точки начала
  panel_ssm_news:
    national_rule: combo
    news_factor: 25                   # в МО с известным событием дисперсия сдвига уровня x25 (месяц события и следующий)
  panel_ssm_chronos:
    national_rule: chronos            # Chronos-2 прогнозирует национальный ряд СберИндекса
  panel_seasonal:
    national_rule: combo
    rho: 0.6                          # затухание текущего отклонения МО к прошлогоднему того же месяца
  lgbm:
    national_rule: combo
    neighbors: 10                     # соседей по автодорогам (connection.parquet)
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    objective: l1                     # MAE в логах -> медиана
    random_state: 42
    n_jobs: 4
    verbose: -1
  lgbm_news:                          # то же + неожиданность новостей GDELT в месяцы o и o-1
    news: [hazard, docs, neg_docs]
    national_rule: combo
    neighbors: 10                     # соседей по автодорогам (connection.parquet)
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    objective: l1                     # MAE в логах -> медиана
    random_state: 42
    n_jobs: 4
    verbose: -1
  ensemble:
    members: [panel_ssm, panel_seasonal, lgbm, timesfm_local, chronos2_local]   # все модели на разложении; среднее в логах, равные веса
  chronos2:
    model: amazon/chronos-2
    batch_size: 256
    threads: 6
  chronos2_cross:
    model: amazon/chronos-2
    batch_size: 512                   # ряды одной категории в одном батче обмениваются информацией
    threads: 6

  chronos2_local:                     # Chronos-2 на локальной компоненте (лог минус общая траектория)
    model: amazon/chronos-2
    national_rule: combo
    batch_size: 256
    threads: 6
  timesfm:
    model: google/timesfm-2.5-200m-pytorch
    batch_size: 256
    threads: 6
  timesfm_local:                      # TimesFM 2.5 на локальной компоненте
    model: google/timesfm-2.5-200m-pytorch
    national_rule: combo
    batch_size: 256
    threads: 6

detection:
  ref_months: 8                       # опорный период: шум и уровень ряда
  per_category: 300                   # рядов на категорию в синтетическом эксперименте
  inject_share: 0.3
  tau_min: 8                          # месяц вставки ступеньки (индекс, 0 = 2023-01)
  tau_max: 20
  deltas: [0.10, 0.20, 0.30]          # размер ступеньки в логах (~10/20/30 %)
  window: 3                           # тревога засчитывается, если пришла не позже tau + 2
  alphas: [0.01, 0.05, 0.10, 0.20]    # доля рядов без вставки с ложной тревогой
  news_true: 0.5                      # доля настоящих сдвигов, о которых есть новость
  news_false: 0.02                    # доля рядов без сдвига с ложной новостью
  news_factor: 25                     # во сколько раз новость повышает вероятность сдвига
  params:
    cusum: {k: 0.5, warm: 8}
    pelt: {w: 3, warm: 6}
    bocpd: {hazard: 0.0417, prior_var: 9.0, w: 3}
  real:
    ref_months: 6                     # на реальных данных опорный период короче: событие E4 - 2023-08
    sample: 1500                      # случайные полные ряды для калибровки порогов
    alpha: 0.05
    top: 40

gdelt:                                # поток новостей GDELT по МО (ref/news, MIT, см. SOURCES.md)
  ref_months: 6                       # опорный период для шума ряда (как в детекции на реальных данных)
  vars: [hazard, neg_docs, docs]      # бедствия (катастрофы+паводки+пожары), негативные, все сообщения
  shift_threshold: 4.0                # подтверждённый сдвиг: |среднее 3 мес. после - 3 мес. до| в единицах шума
  news_threshold: 1.0                 # всплеск: log(1+x) выше среднего за 6 прошлых месяцев на 1 (в ~2.7 раза)
  boot: 300                           # бутстреп по МО для доверительных интервалов
  detector_shift_threshold: 6.0       # метка сдвига для проверки детектора на реальных данных
  alarm_rates: [0.01, 0.02, 0.05]     # доля месяцев с тревогой (одинаковая для сравниваемых детекторов)
